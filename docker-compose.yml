version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ssms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssms_db}
      POSTGRES_USER: ${POSTGRES_USER:-ssms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_school_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssms_user} -d ${POSTGRES_DB:-ssms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-smart-school-management-system-super-secure-dev-key-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-ssms_db}
      POSTGRES_USER: ${POSTGRES_USER:-ssms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_school_password_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
